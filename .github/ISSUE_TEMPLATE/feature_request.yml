name: Feature request
description: Suggest a change
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you write: predictive text, autocorrect, swipe typing, clipboard history, cloud
        sync, analytics and ads are deliberately out of scope. Requests for those will be closed,
        politely. Everything else is fair game.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation where the keyboard gets in your way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Typing behaviour
        - Layout or language
        - Look and feel
        - Accessibility
        - Performance
        - Build or tooling
        - Something else
    validations:
      required: true
