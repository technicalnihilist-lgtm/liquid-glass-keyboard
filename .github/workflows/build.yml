name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: aapt2 → javac → d8 → apksigner
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship an Android SDK; use it rather than a setup
      # action, which tries to install packages that no longer exist.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK on this runner at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK is $SDK"
          ls "$SDK/cmdline-tools" || true

      - name: Install platform 34 and build-tools 34.0.0
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install "platforms;android-34" "build-tools;34.0.0" < /dev/null || true
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          echo "build-tools ready: $("$ANDROID_HOME/build-tools/34.0.0/aapt2" version)"

      - name: Build
        env:
          KS: ${{ github.workspace }}/ci-build-only.jks
          KSPASS: ci-build-only
        run: bash build.sh

      - name: Verify signature, manifest and permissions
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs LiquidGlassKeyboard.apk
          "$BT/aapt2" dump badging LiquidGlassKeyboard.apk | head -3
          echo "--- permissions ---"
          "$BT/aapt2" dump permissions LiquidGlassKeyboard.apk
          if "$BT/aapt2" dump permissions LiquidGlassKeyboard.apk | grep -q INTERNET; then
            echo "::error::APK requests INTERNET — the offline promise is broken"
            exit 1
          fi

      - name: Checksum
        run: sha256sum LiquidGlassKeyboard.apk | tee LiquidGlassKeyboard.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassKeyboard-apk
          path: |
            LiquidGlassKeyboard.apk
            LiquidGlassKeyboard.apk.sha256
          if-no-files-found: error
