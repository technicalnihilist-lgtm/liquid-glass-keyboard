name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: aapt2 → javac → d8 → apksigner
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KS: ${{ github.workspace }}/ci-build-only.jks
          KSPASS: ci-build-only
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash build.sh

      - name: Verify signature and manifest
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs LiquidGlassKeyboard.apk
          "$BT/aapt2" dump badging LiquidGlassKeyboard.apk | head -5
          echo "--- permissions (must be VIBRATE only) ---"
          "$BT/aapt2" dump permissions LiquidGlassKeyboard.apk
          if "$BT/aapt2" dump permissions LiquidGlassKeyboard.apk | grep -q INTERNET; then
            echo "::error::APK requests INTERNET — the offline promise is broken"
            exit 1
          fi

      - name: Checksum
        run: sha256sum LiquidGlassKeyboard.apk | tee LiquidGlassKeyboard.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassKeyboard-apk
          path: |
            LiquidGlassKeyboard.apk
            LiquidGlassKeyboard.apk.sha256
          if-no-files-found: error
